# Injection profile mirrors MultiSpeciesCase::glucose_fructose_linear() in
# validation/reference.rs: Rectangle(0, t_inj, c0) with
# t_inj = 2 * t_total / n_steps = 2 * 400.0 / 2000 = 0.4 s, c0 = 1.0e-3 mol/L.
initial_condition: zero
default_injection:
  type: Rectangle
  start: 0.0
  end: 0.4
  concentration: 0.001
